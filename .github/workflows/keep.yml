name: Guard Protected Assets

on:
  pull_request:
    branches: [ main ]

jobs:
  prevent-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Verify Asset Immutability
        uses: xalvarez/prevent-file-change-action@v3.0.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Regex pattern separating files by a pipe (|) character
          pattern: 'install/esl-8\.4\.so|install/install-fspbx\.sh'
