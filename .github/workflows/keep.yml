name: Guard Protected Assets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-immutability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial for change-comparison utilities
    
      - name: Immutable Files
        uses: asafHalely/immutable-file-action@v1.1
        with:
          files: "install/esl-8\\.4\\.so install/install-fspbx\\.sh"
